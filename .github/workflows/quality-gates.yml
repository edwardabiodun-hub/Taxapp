name: FileSmart quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - taxapp/main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (advisory)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --run

      - name: Build authenticated application
        run: npm run build

      - name: Build public prerendered site
        run: npm run build:public

      - name: Verify public output
        run: npm run verify:public

      - name: Verify Cloudflare staging deployment
        if: ${{ vars.CLOUDFLARE_STAGING_URL != '' }}
        env:
          CLOUDFLARE_STAGING_URL: ${{ vars.CLOUDFLARE_STAGING_URL }}
        run: npm run verify:cloudflare -- "$CLOUDFLARE_STAGING_URL"

      - name: Verify filing evidence register
        run: npm run verify:filing-evidence

      - name: Verify generated output is not tracked as source
        shell: bash
        run: |
          test -f dist-public/404.html
          test -f dist-public/sitemap.xml
          test "$(find dist-public -name index.html | wc -l)" -ge 14
          ! git ls-files --error-unmatch .env >/dev/null 2>&1
          ! git ls-files --error-unmatch dist >/dev/null 2>&1
          ! git ls-files --error-unmatch dist-public >/dev/null 2>&1
